services:
  mysql:
    image: docker.io/library/mysql:9
    container_name: devcli-mysql
    environment:
      MYSQL_ROOT_PASSWORD: devcli
      MYSQL_DATABASE: devcli
    ports:
      - "${MYSQL:-3306}:3306"
  postgres:
    image: docker.io/library/postgres:18
    container_name: devcli-postgres
    environment:
      POSTGRES_PASSWORD: devcli
      POSTGRES_DB: devcli
    ports:
      - "${POSTGRES:-5432}:5432"
  cassandra:
    image: docker.io/library/cassandra:5.0
    container_name: devcli-cassandra
    environment:
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
      CASSANDRA_CLUSTER_NAME: devcli
    ports:
      - "${CASSANDRA:-9042}:9042"
    volumes:
      - ./infra/cassandra/init.cql:/init.cql:ro,Z
  redis:
    image: docker.io/library/redis:8
    container_name: devcli-redis
    ports:
      - "${REDIS:-6380}:6379"
    volumes:
      - ./infra/redis/seed.redis:/seed.redis:ro,Z
  loki:
    image: docker.io/grafana/loki:3.5.5
    container_name: devcli-loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "${LOKI:-3100}:3100"
  grafana:
    image: docker.io/grafana/grafana:latest
    container_name: devcli-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: devcli
    ports:
      - "${GRAFANA:-3000}:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro,Z
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro,Z
  prometheus:
    image: quay.io/prometheus/prometheus:latest
    container_name: devcli-prometheus
    command: --config.file=/etc/prometheus/prometheus.yml --web.enable-lifecycle
    ports:
      - "${PROMETHEUS:-9090}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z
