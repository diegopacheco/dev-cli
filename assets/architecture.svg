<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000">
  <defs>
    <style>@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&amp;display=swap'); text{font-family:'Caveat',cursive;fill:#1e2235}</style>
    <filter id="wobble"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="7"/><feDisplacementMap in="SourceGraphic" scale="4"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3b4060"/></marker>
  </defs>
  <rect width="1400" height="1000" fill="#fdfcf7"/>
  <text x="700" y="52" font-size="46" font-weight="700" text-anchor="middle">devcli architecture</text>

  <g filter="url(#wobble)" stroke="#3b4060" stroke-width="2.5">
    <rect x="560" y="80" width="280" height="80" rx="16" fill="#fff9c4"/>

    <rect x="40" y="220" width="900" height="260" rx="18" fill="#e3f2fd"/>
    <rect x="70" y="285" width="200" height="80" rx="14" fill="#fce4ec"/>
    <rect x="290" y="285" width="200" height="80" rx="14" fill="#fce4ec"/>
    <rect x="510" y="285" width="200" height="80" rx="14" fill="#fce4ec"/>
    <rect x="730" y="285" width="190" height="80" rx="14" fill="#fce4ec"/>
    <rect x="70" y="385" width="420" height="75" rx="14" fill="#fff3e0"/>
    <rect x="510" y="385" width="410" height="75" rx="14" fill="#fff3e0"/>

    <rect x="970" y="220" width="390" height="260" rx="18" fill="#ede7f6"/>

    <rect x="40" y="560" width="240" height="150" rx="18" fill="#e8f5e9"/>
    <rect x="320" y="560" width="240" height="150" rx="18" fill="#fff3e0"/>
    <rect x="600" y="560" width="240" height="150" rx="18" fill="#e0f2f1"/>
    <rect x="880" y="560" width="240" height="150" rx="18" fill="#f3e5f5"/>
    <rect x="1160" y="560" width="200" height="150" rx="18" fill="#e0f7fa"/>

    <rect x="40" y="800" width="520" height="150" rx="18" fill="#f1f8e9"/>
    <rect x="600" y="800" width="240" height="150" rx="18" fill="#fbe9e7"/>
    <rect x="880" y="800" width="480" height="150" rx="18" fill="#ede7f6"/>
  </g>

  <text x="700" y="118" font-size="32" font-weight="700" text-anchor="middle">main.go</text>
  <text x="700" y="146" font-size="22" text-anchor="middle">flags → TUI or one-shot mode</text>

  <text x="70" y="262" font-size="32" font-weight="700">internal/ui · TUI · one tview event loop</text>
  <text x="170" y="320" font-size="26" font-weight="700" text-anchor="middle">Splash</text>
  <text x="170" y="350" font-size="20" text-anchor="middle">ASCII art + connect?</text>
  <text x="390" y="320" font-size="26" font-weight="700" text-anchor="middle">⌘K Palette</text>
  <text x="390" y="350" font-size="20" text-anchor="middle">fuzzy search, Enter goes</text>
  <text x="610" y="320" font-size="26" font-weight="700" text-anchor="middle">⌘/ Shortcuts</text>
  <text x="610" y="350" font-size="20" text-anchor="middle">grouped, searchable</text>
  <text x="825" y="320" font-size="26" font-weight="700" text-anchor="middle">Tab bar</text>
  <text x="825" y="350" font-size="20" text-anchor="middle">⌘1..0, F1..F12</text>
  <text x="280" y="420" font-size="23" font-weight="700" text-anchor="middle">Dashboard · Processes · Containers · Threads</text>
  <text x="280" y="448" font-size="20" text-anchor="middle">braille graphs, kill, shell, jcmd dumps</text>
  <text x="715" y="420" font-size="26" font-weight="700" text-anchor="middle">Console ×8</text>
  <text x="715" y="448" font-size="20" text-anchor="middle">Editor + completion + table/JSON results</text>

  <text x="1165" y="262" font-size="32" font-weight="700" text-anchor="middle">internal/cli</text>
  <text x="1165" y="300" font-size="23" text-anchor="middle">-sql --postgres · --sqlite · -cql</text>
  <text x="1165" y="334" font-size="23" text-anchor="middle">-redis · -loki · -grafana · -prometheus</text>
  <text x="1165" y="368" font-size="23" text-anchor="middle">-ps · -containers · -threads · -discover</text>
  <text x="1165" y="402" font-size="23" text-anchor="middle">tview tags → 24-bit ANSI</text>
  <text x="1165" y="436" font-size="23" text-anchor="middle">banner on stderr, JSON for pipes</text>

  <text x="160" y="600" font-size="28" font-weight="700" text-anchor="middle">internal/sys</text>
  <text x="160" y="636" font-size="21" text-anchor="middle">top, netstat, ioreg</text>
  <text x="160" y="664" font-size="21" text-anchor="middle">ps + signal guard</text>
  <text x="160" y="692" font-size="21" text-anchor="middle">podman / docker</text>

  <text x="440" y="600" font-size="28" font-weight="700" text-anchor="middle">internal/jvm</text>
  <text x="440" y="636" font-size="21" text-anchor="middle">language detection</text>
  <text x="440" y="664" font-size="21" text-anchor="middle">Thread.print parser</text>
  <text x="440" y="692" font-size="21" text-anchor="middle">frame demangling</text>

  <text x="720" y="600" font-size="28" font-weight="700" text-anchor="middle">internal/discover</text>
  <text x="720" y="636" font-size="21" text-anchor="middle">podman inspect</text>
  <text x="720" y="664" font-size="21" text-anchor="middle">image → kind + port</text>
  <text x="720" y="692" font-size="21" text-anchor="middle">env → connect URL</text>

  <text x="1000" y="600" font-size="28" font-weight="700" text-anchor="middle">internal/backend</text>
  <text x="1000" y="636" font-size="21" text-anchor="middle">database/sql · gocql</text>
  <text x="1000" y="664" font-size="21" text-anchor="middle">RESP2 client</text>
  <text x="1000" y="692" font-size="21" text-anchor="middle">Loki · Grafana · Prometheus</text>

  <text x="1260" y="600" font-size="28" font-weight="700" text-anchor="middle">internal/syntax</text>
  <text x="1260" y="636" font-size="21" text-anchor="middle">lexers</text>
  <text x="1260" y="664" font-size="21" text-anchor="middle">completion</text>
  <text x="1260" y="692" font-size="21" text-anchor="middle">ordered JSON</text>

  <text x="300" y="845" font-size="30" font-weight="700" text-anchor="middle">macOS + Podman</text>
  <text x="300" y="882" font-size="22" text-anchor="middle">top, ps, df, sysctl, netstat, ioreg</text>
  <text x="300" y="914" font-size="22" text-anchor="middle">podman ps / inspect / exec / rm</text>

  <text x="720" y="845" font-size="30" font-weight="700" text-anchor="middle">local JVMs</text>
  <text x="720" y="882" font-size="22" text-anchor="middle">Java · Scala · Kotlin · Clojure</text>
  <text x="720" y="914" font-size="22" text-anchor="middle">jcmd PID Thread.print</text>

  <text x="1120" y="845" font-size="30" font-weight="700" text-anchor="middle">data stores and observability</text>
  <text x="1120" y="882" font-size="22" text-anchor="middle">MySQL · Postgres · SQLite · Cassandra · Redis</text>
  <text x="1120" y="914" font-size="22" text-anchor="middle">Loki · Grafana · Prometheus</text>

  <g stroke="#3b4060" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M620 160 C560 190 500 195 490 218"/>
    <path d="M780 160 C860 190 1100 190 1140 218"/>
    <path d="M160 480 L160 558"/>
    <path d="M330 480 L420 558"/>
    <path d="M600 480 L680 558"/>
    <path d="M760 480 L960 558"/>
    <path d="M880 480 C1100 500 1230 520 1250 558"/>
    <path d="M1100 480 L1030 558"/>
    <path d="M1040 480 C960 530 800 530 770 558"/>
    <path d="M160 710 L220 798"/>
    <path d="M720 710 C650 760 480 770 430 798"/>
    <path d="M440 710 C520 760 650 770 700 798"/>
    <path d="M1000 710 L1080 798"/>
  </g>
</svg>
